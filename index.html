
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172440">
<title>Карта желаний</title>
<style>
:root{--night:#172440;--gold:#e8d19c;--cream:#fff5e5;--ink:#293650;--paper:#fff8ec}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background-color:#10213d;
 background-image:linear-gradient(180deg,rgba(10,22,43,.42),rgba(10,22,43,.64)),url("images/new-year-bg.png");
 background-size:cover;background-position:center top;background-repeat:no-repeat;background-attachment:fixed;
 color:var(--cream);font-family:Georgia,"Times New Roman",serif
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
 background:radial-gradient(ellipse at 8% 18%,#d8eaff12,transparent 35%),radial-gradient(ellipse at 92% 72%,#f5d58b12,transparent 34%)
}
button,input,textarea{font:inherit}
#app{max-width:790px;margin:auto;padding:14px 15px 42px}
.top{display:flex;justify-content:space-between;gap:8px;color:#f5e8c9;font:11px Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;margin:5px 0 14px;padding:10px 12px;border:1px solid #d9c79a55;border-radius:12px;background:linear-gradient(110deg,#263b59ed,#344967e8);box-shadow:0 4px 16px #08172b35}
.progress{height:5px;background:#ffffff30;border-radius:8px;overflow:hidden;margin-bottom:14px}
.progress span{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.screen{animation:appear .3s ease}
@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
h1,h2,h3{font-weight:normal;line-height:1.25}
h1{font-size:clamp(34px,8vw,48px);color:var(--gold);margin:10px 0}
h2{font-size:clamp(26px,6vw,34px);color:var(--gold);margin:10px 0}
h3{font-size:21px;color:var(--ink);margin:4px 0 12px}
p{font-size:17px;line-height:1.7;margin:12px 0;color:inherit}
.small{font:13px/1.6 Arial,sans-serif;color:#e1d6c6}
.hero{position:relative;isolation:isolate;min-height:220px;border:1px solid #e8d19c77;border-radius:21px;overflow:hidden;display:flex;align-items:flex-end;padding:24px;margin:10px 0 20px;background:#293b5c}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.9}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#101c35e8,transparent 85%);z-index:-1}
.heroContent{width:100%;text-shadow:0 2px 8px #101c35}
.heroContent p{margin:6px 0}
.coverHero{display:block;min-height:0;padding:0;background:transparent;border:0;border-radius:0;overflow:visible;margin:0 0 16px}
.coverHero>img{position:static;display:block;width:100%;height:auto;max-height:none;object-fit:contain;opacity:1;background:#263b59;border:1px solid #e8d19c88;border-radius:18px;box-shadow:0 12px 34px #06132988}
.coverHero:after{display:none}
.panel{padding:18px;border:1px solid #d9bd8070;border-radius:17px;background:var(--paper);color:var(--ink);margin:17px 0;box-shadow:0 7px 20px #06132922}
.panel p,.panel label{color:var(--ink)}
.panel .small{color:#59647a}
.story{padding:17px 18px;border-radius:16px;background:linear-gradient(145deg,#243653f5,#1c2b47f5);border:1px solid #e8d19c77;margin:15px 0}
.story p{color:#f7eddd}
.notice{border-left:3px solid var(--gold);padding:12px 14px;background:#172b49e8;border-radius:0 11px 11px 0;font:13px/1.7 Arial,sans-serif;color:#fff1d9;margin:18px 0}
.btn{width:100%;display:block;margin:12px 0;padding:14px 17px;border-radius:28px;border:1px solid var(--gold);background:linear-gradient(135deg,#f0dfb7,#c9ad75);color:#1b2945;font-weight:bold;cursor:pointer}
.btn.secondary{background:#ffffff12;color:var(--cream);box-shadow:none}
.btn.back{background:#172b49e8;color:#fff1d9;border-color:#e8d19c88;box-shadow:none;font-size:14px;padding:10px;margin:0 0 14px}
.giftButton{display:flex;align-items:center;justify-content:center;min-height:62px;padding:16px 20px;white-space:normal;overflow-wrap:anywhere;text-align:center;line-height:1.4;background:linear-gradient(135deg,#fff0c9,#d8b56e);color:#172440;border:2px solid #fff0c9;box-shadow:0 5px 18px #07152b88;font-size:16px;font-weight:700}
input[type=text],textarea{width:100%;padding:13px;border-radius:11px;border:1px solid #b9a779;background:#fffdf8;color:#263653;margin:8px 0 14px}
textarea{min-height:90px;resize:vertical;line-height:1.55}
label{display:block;line-height:1.5;color:#263653;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.tile{border:1px solid #d7c18e;background:#fffaf0;color:#263653;border-radius:14px;padding:9px;cursor:pointer;text-align:center;min-width:0;font:14px/1.4 Arial,sans-serif}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;display:block;margin-bottom:8px;background:#e7dfd1}
.tile.selected{border:2px solid #ad8843;background:#f8edcf;box-shadow:0 0 0 2px #e8d19c55}
.tile:focus-visible,.btn:focus-visible{outline:3px solid white;outline-offset:3px}
.artwork{display:block;width:100%;max-height:390px;object-fit:contain;border-radius:17px;margin:17px 0;border:1px solid #e8d19c66;background:#fff8ec}
.pictureStrip{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:15px 0}
.pictureStrip img{width:100%;height:175px;object-fit:contain;border-radius:14px;border:1px solid #e8d19c55;background:#fff8ec}
.sparkGrid .tile{text-align:left;padding:8px}
.sparkGrid .tile img{aspect-ratio:1.25;object-fit:cover}
.sparkGrid .tile span{display:block;padding:0 3px 3px}
.starBox{display:flex;align-items:center;justify-content:center;gap:7px;margin:17px auto 21px;padding:9px 13px;border:1px solid #e8d19c88;border-radius:17px;background:#172440dd;max-width:310px}
.starBox img{width:27px;height:27px;object-fit:contain;opacity:.2}
.starBox img.on{opacity:1;filter:drop-shadow(0 0 6px #f7d77d)}
.starBox span{font:12px Arial,sans-serif;color:#f3dfb6;margin-left:5px}
.boardPreview{margin:18px 0;padding:14px;border-radius:17px;background:#fff6e5;color:#263653;border:1px solid #e8d19c}
.boardPreview img{display:block;width:100%;height:auto;border-radius:9px}
.boardPreview a{display:block;text-align:center;margin:14px 0 5px;color:#263653;font:bold 15px Arial,sans-serif;text-decoration:underline}
.macGrid .tile{padding:7px;background:linear-gradient(145deg,#e9d6ad,#c6ad7d)}
.macGrid .tile img{width:100%;height:165px;aspect-ratio:auto;object-fit:contain;border-radius:9px;background:#fff8ec}
.macReveal{max-width:440px;margin:18px auto;padding:16px;border-radius:19px;background:#fff6e5;color:#263653;text-align:center;box-shadow:0 10px 30px #0003;animation:reveal .5s ease}
.macReveal img{width:100%;max-height:390px;object-fit:contain;border-radius:12px}
.macReveal p{color:#263653}
@keyframes reveal{from{transform:rotateY(80deg);opacity:0}to{transform:rotateY(0);opacity:1}}
.footer{text-align:center;color:#e5dccd;font:13px/1.7 Arial,sans-serif;margin-top:30px;padding:14px 12px;border:1px solid #d9c79a44;border-radius:12px;background:linear-gradient(110deg,#263b59ed,#344967e8);box-shadow:0 4px 16px #08172b35}
.footer strong{font-weight:normal;color:#e8d19c}
body.coverScreen{background:#172440}
body.coverScreen:before{display:none}
body.coverScreen #app{padding-top:12px}
body.coverScreen .top,body.coverScreen .progress,body.coverScreen .footer{display:none}
body.coverScreen .screen{padding-top:0}
body.coverScreen .btn{margin-top:14px}
@media(max-width:600px){
 body{background-attachment:scroll}
 #app{padding:12px 11px 35px}
 .hero{min-height:195px;padding:19px}
 .panel{padding:15px}
 .grid{gap:8px}
 .pictureStrip img{height:140px}
 .sparkGrid .tile img{height:120px}
 .macGrid .tile img{height:140px}
 p{font-size:16px}
}
</style>
</head>
<body>
<div id="app">
 <div class="top"><span>✧ Новогоднее путешествие</span><span id="chapterLabel">Начало</span></div>
 <div class="progress"><span id="progressBar"></span></div>
 <main id="content"></main>
 <div class="footer">Создано с теплом Дианой Шакировой<br><strong>Психолог, телесный терапевт</strong></div>
</div>
<script>
"use strict";
const IMG="images/images/";
const GAME_URL="https://igrapsy.github.io/karta-zhelaniy/";
const content=document.getElementById("content");
const progressBar=document.getElementById("progressBar");
const chapterLabel=document.getElementById("chapterLabel");

 page:"intro",history:[],stars:[],

 wishPictures:[],wishTitle:"",wishText:"",
 wish:"",action:"",futureWords:"",
 start1:"",start2:"",start3:"",
 mac:null,boardDataUrl:""

const pages={
 intro,welcome,chapter1,chapter2,chapter3,chapter4,chapter5,chapter6,
 letter:makeLetter,macChoice,final:finale,macReveal
};

["Прогулки","vision_self_walk.png"],
["Танцы и движение","vision_self_yoga.png"],
["Творчество и вдохновение","vision_work_creativity.png"],

["Изобилие","mac_abundance.png","Замечай возможности и то хорошее, что уже есть в твоей жизни. Позволяй себе хотеть большего и постепенно двигаться к этому."],

["Забота о себе","mac_selfcare.png","Твоё время, внимание и бережное отношение к себе важны. Позволяй себе получать заботу."]
];

function safe(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function img(file,alt="",cls="artwork"){
 return `<img class="${cls}" src="${IMG}${file}" alt="${safe(alt)}" loading="lazy" onerror="this.style.display='none'">`;
}
function hero(title,subtitle,file){
 return `<section class="hero">${file?img(file,title,""):""}
 <div class="heroContent"><div class="small">${safe(subtitle||"НОВОГОДНЕЕ ПУТЕШЕСТВИЕ")}</div>
 <h2>${safe(title)}</h2></div></section>`;
}
function panel(html){return `<section class="panel">${html}</section>`;}
function btn(label,action,secondary=false){
 return `<button type="button" class="btn ${secondary?"secondary":""}" onclick="${action}">${label}</button>`;
}
function starline(){
 return `<div class="starBox">${Array.from({length:6},(_,i)=>
 `<img src="${IMG}star_single.png" class="${state.stars.includes(i)?"on":""}" alt="">`
 ).join("")}<span>${state.stars.length} / 6</span></div>`;
}
function updateProgress(){
 const n=state.page==="intro"||state.page==="welcome"?0:state.page==="final"?6:
 Math.min(6,Number(state.page.replace("chapter",""))||0);
 progressBar.style.width=(n/6*100)+"%";
 chapterLabel.textContent=state.page==="intro"?"Начало":
 state.page==="welcome"?"Приглашение":
 state.page==="final"?"Завершение":
 state.page==="letter"||state.page==="macChoice"||state.page==="macReveal"?"Подарок":`Глава ${n}`;
}
function show(html){
 document.body.classList.toggle("coverScreen",state.page==="intro");
 content.innerHTML=`<div class="screen">${state.page!=="intro"?
 `<button class="btn back" type="button" onclick="goBack()">← Назад</button>`:""}${html}</div>`;
 updateProgress();
 window.scrollTo({top:0,behavior:"smooth"});
}
function go(name){
 state.history.push(state.page);
 renderPage(name);
}
function goBack(){
 const previous=state.history.pop();
 if(previous)renderPage(previous);
 else intro();
}
function renderPage(name){
 state.page=name;
 if(name==="letter")makeLetter();
 else if(name==="final")finale();
 else if(pages[name])pages[name]();
}
function completeChapter(number,nextName){
 if(!state.stars.includes(number))state.stars.push(number);
 go(nextName);
}

function intro(){
 state.page="intro";
 show(`
 <div class="hero coverHero">
 <img src="${IMG}cover.png" alt="Обложка игры «Карта желаний»" loading="eager">
 </div>
 ${btn("Начать путешествие","go('welcome')")}`);
}

function welcome(){
 state.page="welcome";
 show(`
 ${hero("Новогоднее путешествие","ДОБРО ПОЖАЛОВАТЬ В МАСТЕРСКУЮ ЖЕЛАНИЙ","invitation.png")}
 ${panel(`<h3>Приготовься к путешествию</h3>
 <p>Тебе понадобятся лист бумаги А4, цветные карандаши, фломастеры или краски, ручка. По желанию — блокнот.</p>
 <p>Устройся поудобнее, приготовь любимый напиток и выдели немного времени только для себя. Здесь не нужно торопиться: можно проходить главы в своём темпе, делать паузы и возвращаться к заданиям.</p>`)}
 <div class="notice">Эта игра создана для самопознания, вдохновения и творческого исследования желаний. Она не заменяет психотерапию или индивидуальную психологическую помощь. Ты можешь пропустить любое упражнение или остановить игру в любой момент. Если появятся сильные чувства, сделай паузу, позаботься о себе и при необходимости обратись за поддержкой к квалифицированному специалисту.</div>
 ${btn("Открыть волшебное письмо","go('chapter1')")}`);
}

function chapter1(){
 state.page="chapter1";
 show(`
 ${hero("Таинственное приглашение","ГЛАВА ПЕРВАЯ","chapter1_room.png")}
 ${img("magic_book.png","Волшебная книга")}
 <div class="story">
 <p>В один из зимних вечеров ты замечаешь на подоконнике необычный конверт. На нём — золотая снежинка, а на обратной стороне нет ни имени, ни адреса.</p>
 <p>Стоит тебе прикоснуться к конверту, как снежинка начинает мягко мерцать. Письмо раскрывается само собой. На старинной бумаге проступают слова:</p>
 <p><em>«Есть желания, которые тихо ждут своего часа. Есть мечты, которым не нужны обещания — им нужно немного твоего внимания. Если ты готова прислушаться к себе, приходи в Мастерскую желаний. Дорогу найдёт та, которая позволит себе помечтать».</em></p>
 </div>
 ${img("chapter1_door.png","Дверь в волшебное путешествие")}
 ${panel(`<h3>Перед дорогой — несколько вопросов</h3>
 <p class="small">Не ищи правильные ответы. Записывай первое, что приходит, или просто размышляй.</p>
 <label>Чего мне хочется больше в следующем году?</label>
 <textarea oninput="state.start1=this.value" placeholder="Мне хочется больше...">${safe(state.start1||"")}</textarea>
 <label>Какие приятные события я хотела бы пригласить в свою жизнь?</label>
 <textarea oninput="state.start2=this.value" placeholder="Я была бы рада...">${safe(state.start2||"")}</textarea>
 <label>Что я давно хотела попробовать, но откладывала?</label>
 <textarea oninput="state.start3=this.value" placeholder="Мне давно интересно...">${safe(state.start3||"")}</textarea>`)}
 <div class="story"><p>Когда ты заканчиваешь, снежинка на конверте вспыхивает золотом. За окном среди снежных хлопьев появляется тонкая светящаяся дорожка. Кажется, она ведёт именно туда, где тебя уже ждут.</p></div>
 ${starline()}${btn("Отправиться дальше","completeChapter(0,'chapter2')")}`);
}

function chapter2(){
 state.page="chapter2";
 show(`
 ${hero("Сад энергии","ГЛАВА ВТОРАЯ","bg_light.png")}
 <div class="story">
 <p>Светящаяся дорожка приводит тебя в сад, укрытый пушистым снегом. Между деревьями мерцают маленькие фонари. Каждый из них освещает что-то приятное: тропинку к морю, чашку горячего чая, книгу, танец, встречу с близкими.</p>
 <p>У одного из фонарей стоит Хранительница сада. Она бережно держит в руках маленький светящийся огонёк.</p>
 <p><em>«Это искорка твоей энергии, — говорит она. — Она загорается, когда в жизни есть место тому, что тебе нравится. Иногда мы так увлекаемся делами, что забываем замечать простые радости. Давай вспомним о них».</em></p>
 </div>

 if(state.wishPictures.includes(i)){

function loadImage(file){
 return new Promise(resolve=>{
  const im=new Image();
  im.onload=()=>resolve(im);
  im.onerror=()=>resolve(null);
  im.src=IMG+file;
 });
}
function fitImage(ctx,im,x,y,w,h){
 const scale=Math.min(w/im.width,h/im.height);
 const dw=im.width*scale,dh=im.height*scale;
 ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}
function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines){
 if(!text)return y;
 const words=text.split(/\s+/);
 let line="",yy=y,lines=0;
 for(const word of words){
  const test=line?line+" "+word:word;
  if(ctx.measureText(test).width>maxWidth&&line){
   ctx.fillText(line,x,yy);
   yy+=lineHeight;lines++;line=word;
   if(lines>=maxLines)return yy;
  }else line=test;
 }
 if(line)ctx.fillText(line,x,yy);
 return yy+lineHeight;
}
async function buildWishBoard(){
 const box=document.getElementById("boardPreview");
 box.innerHTML='<div class="notice">Собираю твою карту…</div>';
 const chosen=state.wishPictures.slice(0,12);
 const loaded=await Promise.all(chosen.map(i=>loadImage(wishPictures[i][0])));
 const valid=loaded.map((im,index)=>({im,index})).filter(x=>x.im);
 const cols=2,cellW=500,cellH=340,gapX=45,gapY=25;
 const rows=Math.ceil(valid.length/cols);
 const startX=77,startY=260;
 const noteLines=Math.min(5,Math.ceil((state.wishText||"").length/55));
 const canvas=document.createElement("canvas");
 canvas.width=1200;
 canvas.height=Math.max(950,startY+rows*(cellH+gapY)+250+(noteLines?noteLines*45:0));
 const ctx=canvas.getContext("2d");
 if(!ctx){box.innerHTML='<p>Не удалось подготовить изображение в этом браузере.</p>';return;}
 const grad=ctx.createLinearGradient(0,0,1200,canvas.height);
 grad.addColorStop(0,"#fff8ec");
 grad.addColorStop(1,"#e8dcc4");
 ctx.fillStyle=grad;
 ctx.fillRect(0,0,1200,canvas.height);
 ctx.fillStyle="#263653";
 ctx.textAlign="center";
 ctx.font="bold 58px Georgia";
 const title=(state.wishTitle||"Моя карта желаний").trim();
 wrapText(ctx,title,600,92,1040,68,2);
 ctx.font="28px Georgia";
 ctx.fillText("Мои желания и направления",600,205);
 valid.forEach(({im,index},n)=>{
  const col=n%cols,row=Math.floor(n/cols);
  const x=startX+col*(cellW+gapX);
  const y=startY+row*(cellH+gapY);
  ctx.save();
  ctx.shadowColor="#00000020";
  ctx.shadowBlur=12;
  ctx.fillStyle="#fff";
  ctx.fillRect(x-8,y-8,cellW+16,cellH+16);
  ctx.restore();
  ctx.fillStyle="#fdfbf6";
  ctx.fillRect(x,y,cellW,cellH-65);
  fitImage(ctx,im,x+12,y+10,cellW-24,cellH-85);
  ctx.fillStyle="#263653";
  ctx.font="25px Georgia";
  ctx.textBaseline="middle";
  ctx.fillText(wishPictures[chosen[index]][1],x+cellW/2,y+cellH-34,cellW-18);
  ctx.textBaseline="alphabetic";
 });
 let y=startY+rows*(cellH+gapY)+22;
 if(state.wishText&&state.wishText.trim()){
  ctx.fillStyle="#263653";
  ctx.font="29px Georgia";
  y=wrapText(ctx,state.wishText.trim(),600,y,1000,42,5)+15;
 }
 ctx.font="24px Georgia";
 ctx.fillText("Мой путь начинается с маленького шага",600,Math.min(canvas.height-45,y+35));
 try{
  state.boardDataUrl=canvas.toDataURL("image/png");
  box.innerHTML=`<div class="boardPreview">
   <h3>Твоя карта желаний готова</h3>
   <img src="${state.boardDataUrl}" alt="Готовая карта желаний">
   <a href="${state.boardDataUrl}" download="karta-zhelaniy.png">Сохранить карту на устройство</a>
   <p class="small">На iPhone, если кнопка не скачивает файл, нажми и удерживай само изображение, затем выбери «Сохранить в Фото» или «Сохранить в Файлы».</p>
  </div>`;
  box.scrollIntoView({behavior:"smooth",block:"start"});
 }catch(e){
  box.innerHTML='<p class="small">Не удалось подготовить изображение. Попробуй выбрать меньше картинок.</p>';
 }
}
