<style>
:root{--night:#14213d;--night2:#26395c;--gold:#e8d19c;--cream:#fff5df;--muted:#d7d1c5;--paper:#fff6e5;--ink:#263653}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--cream);font-family:Georgia,"Times New Roman",serif;background:#14213d url('images/images/bg_dark.png') center top/cover fixed no-repeat}button,input,textarea{font:inherit}button{touch-action:manipulation}#app{max-width:790px;margin:auto;padding:16px 15px 46px}.top{display:flex;justify-content:space-between;gap:10px;font:11px Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin:5px 2px 13px}.progress{height:5px;border-radius:10px;background:#ffffff30;overflow:hidden;margin-bottom:14px}.progress span{display:block;height:100%;width:0;background:var(--gold);transition:width .35s}.screen{animation:appear .35s ease}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{font-weight:normal;line-height:1.25}h1{font-size:clamp(34px,8vw,49px);color:var(--gold);margin:10px 0}h2{font-size:clamp(25px,6vw,32px);color:var(--gold);margin:10px 0}h3{font-size:21px;color:var(--ink);margin:4px 0 12px}p{font-size:17px;line-height:1.72;color:#f4ecdf;margin:13px 0}.small{font:14px/1.6 Arial,sans-serif;color:#e2d8c8}.hero{min-height:230px;border-radius:23px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;margin:10px 0 22px;border:1px solid #e8d19c77;background:#293b5c;position:relative;isolation:isolate}.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.88;z-index:-2}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#101c35e8,#101c3540 70%,#101c3520);z-index:-1}.heroContent{max-width:570px;text-shadow:0 2px 9px #101c35}.heroContent p{margin:8px 0}.panel{padding:19px;border:1px solid #d9bd805e;border-radius:18px;background:linear-gradient(145deg,#fff8e8f2,#f4e6cce8);color:var(--ink);margin:18px 0;box-shadow:0 8px 25px #06132925}.panel p,.panel label{color:var(--ink)}.panel .small{color:#59647a}.notice{border-left:3px solid var(--gold);padding:13px 15px;background:#ffffff12;border-radius:0 12px 12px 0;font:14px/1.7 Arial,sans-serif;color:#eee4d5;margin:20px 0}.btn{width:100%;display:block;margin:13px 0;padding:15px 18px;border-radius:30px;border:1px solid var(--gold);background:linear-gradient(135deg,#f0dfb7,#c9ad75);color:#1b2945;font-weight:bold;cursor:pointer;box-shadow:0 4px 12px #0002}.btn.secondary{background:#ffffff12;color:var(--cream);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}input[type=text],textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #b9a779;background:#fffdf8;color:#263653;margin:8px 0 15px}textarea{min-height:90px;resize:vertical;line-height:1.55}label{display:block;line-height:1.5;color:#263653;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{border:1px solid #d7c18e;background:#fffaf0;color:#263653;border-radius:15px;padding:9px;cursor:pointer;text-align:center;min-width:0;font:14px/1.4 Arial,sans-serif}.tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;margin-bottom:8px;background:#e7dfd1}.tile.selected{border:2px solid #ad8843;background:#f8edcf;box-shadow:0 0 0 2px #e8d19c55}.tile:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}.artwork{width:100%;display:block;border-radius:18px;margin:17px 0;max-height:390px;object-fit:cover;border:1px solid #e8d19c55}.scenePair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.scenePair img{width:100%;height:190px;object-fit:cover;border-radius:16px;border:1px solid #e8d19c55}.starBox{display:flex;align-items:center;justify-content:center;gap:8px;margin:17px auto 22px;padding:10px 14px;border:1px solid #e8d19c55;border-radius:18px;background:#ffffff0b;max-width:310px}.starBox img{width:28px;height:28px;object-fit:contain;opacity:.22}.starBox img.on{opacity:1;filter:drop-shadow(0 0 7px #f7d77d)}.starBox span{font:12px Arial,sans-serif;color:#f3dfb6;margin-left:5px}.footer{text-align:center;color:#d2c7b7;font:13px/1.7 Arial,sans-serif;margin-top:32px}.story{padding:17px 18px;border-radius:17px;background:linear-gradient(145deg,#ffffff17,#ffffff09);border:1px solid #e8d19c30;margin:14px 0}.story p:first-child{margin-top:0}.story p:last-child{margin-bottom:0}.pictureStrip{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.pictureStrip img{width:100%;height:180px;object-fit:cover;border-radius:15px;border:1px solid #e8d19c55}.sparkGrid .tile{text-align:left;padding:8px}.sparkGrid .tile img{aspect-ratio:1.22;margin-bottom:7px}.sparkGrid .tile span{display:block;padding:0 3px 3px}.boardPreview{margin:18px 0;padding:14px;border-radius:18px;background:#fff6e5;color:#263653;border:1px solid #e8d19c}.boardPreview img{display:block;width:100%;height:auto;border-radius:10px}.boardPreview a{display:block;text-align:center;margin:13px 0 4px;color:#263653;font: bold 15px Arial,sans-serif;text-decoration:underline}.macGrid .tile{padding:7px;background:linear-gradient(145deg,#e9d6ad,#c6ad7d);border-color:#f1dfb6}.macGrid .tile img{width:100%;height:170px;aspect-ratio:auto;object-fit:cover;border-radius:10px}.macReveal{max-width:440px;margin:18px auto;padding:16px;border-radius:20px;background:#fff6e5;color:#263653;text-align:center;box-shadow:0 10px 30px #0003;animation:flip .55s ease}.macReveal img{width:100%;max-height:400px;object-fit:contain;border-radius:13px}.macReveal p{color:#263653}.macReveal h3{margin-top:12px}@keyframes flip{0%{transform:rotateY(90deg);opacity:0}100%{transform:rotateY(0);opacity:1}}.footer strong{font-weight:normal;color:#e8d19c}
@media(max-width:430px){#app{padding:13px 12px 38px}.hero{min-height:195px;padding:20px}.panel{padding:16px}.grid{gap:8px}.scenePair img{height:140px}.sparkGrid .tile img{height:120px}.macGrid .tile img{height:145px}p{font-size:16px}}
</style>
</head>
<body>
<div id="app"><div class="top"><span>✧ Новогоднее путешествие</span><span id="chapterLabel">Начало</span></div><div class="progress"><span id="progressBar"></span></div><main id="content"></main><div class="footer">Создано с теплом Дианой Шакировой<br><strong>Психолог, телесный терапевт</strong></div></div>
<script>
  "use strict";
const IMG="images/images/";
const GAME_URL="https://igrapsy.github.io/karta-zhelaniy/";
const chapters=["Таинственное приглашение","Сад энергии","Мастерская вдохновения","Дворец желаний","Дорога возможностей","Подарок из будущего"];
const wishPictures=[
["vision_home_apartment.png","Квартира мечты"],["vision_home_bedroom.png","Уютная спальня"],["vision_home_house.png","Дом мечты"],["vision_home_living.png","Гостиная"],["vision_home_terrace.png","Терраса"],
["vision_travel_car.png","Путешествие на машине"],["vision_travel_hotel.png","Красивый отель"],["vision_travel_island.png","Остров"],["vision_travel_italy.png","Италия"],["vision_travel_mountains.png","Горы"],["vision_travel_paris.png","Париж"],["vision_travel_plane.png","Новые путешествия"],["vision_travel_sea.png","Море"],
["vision_work_business.png","Своё дело"],["vision_work_creativity.png","Творчество"],["vision_work_office.png","Рабочее пространство"],["vision_work_project.png","Свой проект"],["vision_work_stage.png","Выступления"],["vision_work_study.png","Обучение"],
["vision_money_car.png","Большая покупка"],["vision_money_comfort.png","Комфорт"],["vision_money_income.png","Доход"],["vision_money_opportunities.png","Возможности"],["vision_money_planning.png","Финансовая свобода"],["vision_money_savings.png","Накопления"],
["vision_love_connection.png","Близость"],["vision_love_couple.png","Любовь"],["vision_love_family.png","Семья"],["vision_love_friends.png","Друзья"],["vision_love_hug.png","Объятия"],["vision_love_travel.png","Путешествие вместе"],
["vision_self_care.png","Забота о себе"],["vision_self_morning.png","Красивое утро"],["vision_self_reading.png","Чтение"],["vision_self_solo_trip.png","Путешествие для себя"],["vision_self_walk.png","Прогулки"],["vision_self_yoga.png","Йога и движение"]
];
/* Для карты «Опора» используется лицевая иллюстрация mac_inner_light.png. mac_back.png — только рубашка. */
const macCards=[
["Изобилие","mac_abundance.png","Замечай возможности и то хорошее, что уже есть в твоей жизни. Позволяй себе хотеть большего и постепенно двигаться к этому."],
["Опора","mac_inner_light.png","Твоя опора может складываться из твоего опыта, ценностей, близких людей и бережных решений. Вспомни, что уже помогало тебе справляться и возвращаться к себе."],
["Расцвет","mac_bloom.png","У всего есть свой ритм. Дай себе время раскрывать то, что уже созревает внутри."],
["Спокойствие","mac_calm.png","Иногда ясность приходит, когда ты позволяешь себе замедлиться и услышать собственные ощущения."],
["Смелость","mac_courage.png","Необязательно быть бесстрашной. Маленький шаг навстречу важному тоже может быть смелостью."],
["Свобода","mac_freedom.png","Замечай, где у тебя появляется больше пространства для выбора и возможности поступать по-своему."],
["Вдохновение","mac_inspiration.png","Разрешай себе замечать то, что вызывает любопытство и желание творить."],
["Радость","mac_joy.png","Не откладывай приятные моменты на особенный день. Маленькая радость тоже имеет значение."],
["Движение","mac_movement.png","Тебе не обязательно видеть весь путь. Иногда достаточно выбрать направление и сделать один посильный шаг."],
["Новый путь","mac_new_path.png","Новый этап может начинаться постепенно — с интереса, решения или маленькой возможности."],
["Забота о себе","mac_selfcare.png","Твоё время, внимание и бережное отношение к себе важны. Позволяй себе получать заботу."],
["Новые возможности","mac_opportunities.png","Необязательно заранее знать, куда приведёт новая возможность. Можно присмотреться к ней и решить, подходит ли она тебе."]
];
const sparkOptions=[
["Прогулки","vision_self_walk.png"],["Танцы и движение","vision_self_yoga.png"],["Музыка и вдохновение","vision_work_creativity.png"],["Путешествия","vision_travel_sea.png"],["Творчество","vision_work_creativity.png"],["Встречи с друзьями","vision_love_friends.png"],["Чтение","vision_self_reading.png"],["Уютные вечера","vision_home_living.png"],["Забота о себе","vision_self_care.png"],["Обучение","vision_work_study.png"],["Время наедине с собой","vision_self_solo_trip.png"],["Вкусная еда и маленькие удовольствия","vision_money_comfort.png"],["Близкие люди","vision_love_hug.png"],["Природа и море","vision_travel_mountains.png"]
];
const state={page:"intro",stars:[],sparks:[],customSpark:"",wishPictures:[],wishTitle:"",wishText:"",wish:"",action:"",futureWords:"",mac:null,boardDataUrl:""};
const content=document.getElementById("content"),progressBar=document.getElementById("progressBar"),chapterLabel=document.getElementById("chapterLabel");
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function img(file,alt="",cls="artwork"){return `<img class="${cls}" src="${IMG}${file}" alt="${safe(alt)}" loading="lazy" onerror="this.style.display='none'">`;}
function hero(title,subtitle,file){return `<section class="hero">${file?img(file,title,""):""}<div class="heroContent"><div class="small">${safe(subtitle||"НОВОГОДНЕЕ ПУТЕШЕСТВИЕ")}</div><h2>${safe(title)}</h2></div></section>`;}
function panel(html){return `<section class="panel">${html}</section>`;}
function btn(label,fn,secondary=false){return `<button type="button" class="btn ${secondary?"secondary":""}" onclick="${fn}">${label}</button>`;}
function starline(){return `<div class="starBox" aria-label="Получено ${state.stars.length} из 6 звёзд">${Array.from({length:6},(_,i)=>`<img src="${IMG}star_single.png" class="${state.stars.includes(i)?"on":""}" alt="${state.stars.includes(i)?"Полученная звезда":"Ещё не получена"}">`).join("")}<span>${state.stars.length} / 6</span></div>`;}
function updateProgress(){const n=state.page==="intro"?0:state.page==="final"?6:Math.min(6,Number(state.page)+1);progressBar.style.width=(n/6*100)+"%";chapterLabel.textContent=state.page==="intro"?"Начало":state.page==="final"?"Завершение":`Глава ${n}`;}
function show(html){content.innerHTML=`<div class="screen">${html}</div>`;updateProgress();window.scrollTo({top:0,behavior:"smooth"});}
function completeChapter(n,next){if(!state.stars.includes(n))state.stars.push(n);next();}
function intro(){state.page="intro";show(`
<div class="hero">${img("cover.png","Карта желаний","")}<div class="heroContent"><div class="small">НОВОГОДНЕЕ СКАЗОЧНОЕ ПРИКЛЮЧЕНИЕ</div><h1>Карта желаний</h1><p>Путешествие к тому, что хочется пригласить в свою жизнь</p></div></div>
${img("invitation.png","Волшебное приглашение","artwork")}
${panel(`<h3>Приготовься к путешествию</h3><p>Тебе понадобятся лист бумаги А4, цветные карандаши, фломастеры или краски, ручка. По желанию — блокнот.</p><p>Устройся поудобнее, приготовь любимый напиток и выдели немного времени только для себя. Здесь не нужно торопиться: можно проходить главы в своём темпе, делать паузы и возвращаться к заданиям.</p>`)}
<div class="notice">Эта игра создана для самопознания, вдохновения и творческого исследования желаний. Она не заменяет психотерапию или индивидуальную психологическую помощь. Ты можешь пропустить любое упражнение или остановить игру в любой момент. Если появятся сильные или глубокие чувства, сделай паузу, позаботься о себе и при необходимости обратись за поддержкой к квалифицированному специалисту.</div>
${btn("Открыть волшебное письмо","chapter1()")}`);}
function chapter1(){state.page="0";show(`
${hero("Таинственное приглашение","ГЛАВА ПЕРВАЯ", "chapter1_room.png")}
<div class="story"><p>В один из зимних вечеров, когда за окном медленно кружатся снежинки, ты замечаешь на подоконнике необычный конверт. Он словно хранит внутри маленькое солнце. На печати — золотая снежинка, а на обратной стороне нет ни имени, ни адреса.</p><p>Стоит тебе прикоснуться к конверту, как по комнате разливается мягкий свет. Письмо раскрывается само собой. На старинной бумаге проступают слова:</p><p><em>«Есть желания, которые тихо ждут своего часа. Есть мечты, которым не нужны обещания — им нужно немного твоего внимания. Если ты готова прислушаться к себе, приходи в Мастерскую желаний. Дорогу найдёт та, которая позволит себе помечтать».</em></p></div>
${img("chapter1_door.png","Дверь в волшебное путешествие")}
${panel(`<h3>Перед дорогой — несколько вопросов</h3><p class="small">Не ищи правильные ответы. Записывай первое, что приходит, или просто размышляй.</p><label>Чего мне хочется больше в следующем году?</label><textarea id="start1" placeholder="Мне хочется больше..."></textarea><label>Какие приятные события я хотела бы пригласить в свою жизнь?</label><textarea id="start2" placeholder="Я была бы рада..."></textarea><label>Что я давно хотела попробовать, но откладывала?</label><textarea id="start3" placeholder="Мне давно интересно..."></textarea>`)}
<div class="story"><p>Когда ты заканчиваешь, снежинка на конверте вспыхивает золотом. За окном среди снежных хлопьев появляется тонкая светящаяся дорожка. Кажется, она ведёт именно туда, где тебя уже ждут.</p></div>
${starline()}${btn("Отправиться дальше","completeChapter(0,chapter2)")}`);}
function chapter2(){state.page="1";show(`
${hero("Сад энергии","ГЛАВА ВТОРАЯ","bg_light.png")}
<div class="story"><p>Светящаяся дорожка приводит тебя в сад, укрытый пушистым снегом. Здесь удивительно тихо, но сад совсем не спит: на ветвях мерцают сотни маленьких огоньков. Стоит приблизиться к одному из них — и внутри вспыхивает тёплая картинка: прогулка, любимая песня, смех подруги, запах свежего хлеба, дорога к морю.</p><p>Из-за заснеженной арки выходит Хранительница сада. В её ладонях светятся крошечные искры.</p><p><em>«Это напоминания о том, что возвращает нам вкус жизни, — говорит она. — Иногда энергия приходит не из грандиозных событий, а из простых вещей, которым мы разрешаем быть в наших днях».</em></p></div>
${img("chapter3_guardian.png","Хранительница волшебного сада")}
${panel(`<h3>Собери свои искорки</h3><p class="small">Выбирай картинки, которые напоминают о том, что приносит удовольствие, вдохновение или помогает восстановить силы. Можно выбрать несколько.</p><div class="grid sparkGrid">${sparkOptions.map(([t,f],i)=>`<button type="button" class="tile ${state.sparks.includes(t)?"selected":""}" onclick="toggleSpark(${i},this)"><img src="${IMG+f}" alt="${safe(t)}" loading="lazy"><span>${safe(t)}</span></button>`).join("")}</div><label>А что ещё зажигает твою искорку?</label><input id="customSpark" type="text" placeholder="Добавь свой вариант" value="${safe(state.customSpark)}">`)}
<div class="story"><p>Хранительница предлагает тебе выбрать одну искорку, которую особенно хочется чаще видеть в своей повседневности. Не обязательно менять всю жизнь — иногда достаточно дать одному приятному занятию немного больше места.</p></div>
${starline()}${btn("Сохранить мои искорки","saveSparks()")}`);}
function toggleSpark(i,el){const name=sparkOptions[i][0];if(state.sparks.includes(name)){state.sparks=state.sparks.filter(x=>x!==name);el.classList.remove("selected");}else{state.sparks.push(name);el.classList.add("selected");}}
function saveSparks(){const el=document.getElementById("customSpark");state.customSpark=el?el.value.trim():state.customSpark;if(state.customSpark&&!state.sparks.includes(state.customSpark))state.sparks.push(state.customSpark);completeChapter(1,chapter3);}
  function chapter3(){state.page="2";show(`
${hero("Мастерская вдохновения","ГЛАВА ТРЕТЬЯ","chapter3_workshop.png")}
<div class="story"><p>За садом ты находишь маленькую мастерскую. В окнах мерцает тёплый свет, а внутри пахнет бумагой, деревом и красками. На столе лежит чистый лист, рядом — коробочка с карандашами.</p><p>«В этом месте не оценивают красоту рисунков, — улыбается Хранительница. — Здесь каждый создаёт свой особенный знак. Он будет напоминать о том, что уже наполняет жизнь теплом».</p></div>
${img("resource_flower_example.png","Пример цветка ресурсов")}
${panel(`<h3>Арт-практика «Цветок моих ресурсов»</h3><p>Возьми лист А4 и нарисуй большой цветок с 8–10 лепестками.</p><p>В центре напиши: <strong>«Мои источники радости и энергии».</strong></p><p>На каждом лепестке запиши то, что приносит тебе удовольствие, вдохновение или помогает отдохнуть. Это могут быть занятия, места, люди, маленькие радости, мечты или привычки.</p><p>Раскрась цветок, укрась его узорами, символами и рисунками. Не обязательно заполнять все лепестки. Здесь нет правильного или неправильного результата — пусть он будет именно твоим.</p>`)}
${img("resource_flower_ready.png","Цветок ресурсов")}
<div class="story"><p>Когда цветок будет готов, положи карандаш и немного посмотри на него. Возможно, среди лепестков есть то, чему давно хотелось уделить больше внимания. Это не список обязанностей, а напоминание: в твоей жизни уже есть источники радости, к которым можно возвращаться.</p></div>
${starline()}${btn("Мой цветок готов","completeChapter(2,chapter4)")}`);}
function chapter4(){state.page="3";show(`
${hero("Дворец желаний","ГЛАВА ЧЕТВЁРТАЯ","chapter4_palace.png")}
<div class="story"><p>Тропа приводит тебя к дворцу, окна которого светятся золотом. Внутри — просторная галерея образов. На стенах оживают картины: уютные дома, дальние берега, любимые люди, новые занятия, путешествия и мечты.</p><p>Хранительница раскрывает перед тобой большую книгу. «Здесь можно собрать свою карту желаний. Не как список обещаний и требований к себе, а как красивое напоминание о том, что тебе интересно, дорого и важно».</p></div>
${img("chapter4_table.png","Стол для создания карты желаний")}
${panel(`<h3>Выбери образы для своей карты</h3><p class="small">Нажимай на изображения, которые хочется включить в свою карту. Можно выбрать до 12 картинок.</p><div class="grid">${wishPictures.map(([file,title],i)=>`<button type="button" class="tile ${state.wishPictures.includes(i)?"selected":""}" onclick="toggleWishPicture(${i},this)"><img src="${IMG+file}" alt="${safe(title)}" loading="lazy">${safe(title)}</button>`).join("")}</div><label>Название моей карты</label><input id="wishTitle" type="text" placeholder="Например: Мой год возможностей" value="${safe(state.wishTitle)}"><label>Мои желания, слова и фразы</label><textarea id="wishText" placeholder="Напиши слова, которые хочется видеть на своей карте...">${safe(state.wishText)}</textarea>`)}
<div class="notice">Сначала собери и посмотри готовую карту, затем сохрани её на телефон. Карта создаётся прямо в браузере и не хранится на сервере. Если закроешь или обновишь страницу, выбранные изображения могут сброситься.</div>

function toggleWishPicture(i,el){if(state.wishPictures.includes(i)){state.wishPictures=state.wishPictures.filter(x=>x!==i);el.classList.remove("selected");}else if(state.wishPictures.length>=12){alert("Для красивой композиции можно выбрать не больше 12 изображений.");}else{state.wishPictures.push(i);el.classList.add("selected");}}
function getBoardValues(){const t=document.getElementById("wishTitle"),w=document.getElementById("wishText");if(t)state.wishTitle=t.value.trim();if(w)state.wishText=w.value.trim();if(!state.wishTitle)state.wishTitle="Мой год возможностей";}
function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines){if(!text)return;const words=text.split(/\s+/);let line="",yy=y,lines=0;for(const word of words){const test=line?line+" "+word:word;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,yy);yy+=lineHeight;lines++;line=word;if(lines>=maxLines)return;}else line=test;}if(line)ctx.fillText(line,x,yy);}
function loadImage(file){return new Promise(resolve=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>resolve(null);im.src=IMG+file;});}
async function buildWishBoard(){getBoardValues();const box=document.getElementById("boardPreview");box.innerHTML='<div class="notice">Собираю твою карту…</div>';const canvas=document.createElement("canvas");canvas.width=1200;canvas.height=1500;const ctx=canvas.getContext("2d");if(!ctx){box.innerHTML='<p class="small">Браузер не смог подготовить изображение. Попробуй обновить страницу.</p>';return;}
const grad=ctx.createLinearGradient(0,0,1200,1500);grad.addColorStop(0,"#fff6e5");grad.addColorStop(1,"#e7d5ad");ctx.fillStyle=grad;ctx.fillRect(0,0,1200,1500);ctx.fillStyle="#263653";ctx.textAlign="center";ctx.font="bold 56px Georgia";wrapText(ctx,state.wishTitle,600,95,1040,66,2);ctx.font="28px Georgia";ctx.fillText("Мои желания и направления",600,185);
const chosen=state.wishPictures.slice(0,12);const loaded=await Promise.all(chosen.map(i=>loadImage(wishPictures[i][0])));const startY=235,cols=3,cellW=350,cellH=260,startX=75;let drawn=0;for(let i=0;i<loaded.length;i++){const im=loaded[i];if(!im)continue;const col=drawn%cols,row=Math.floor(drawn/cols),x=startX+col*cellW,y=startY+row*cellH;const ratio=Math.min(300/im.width,185/im.height);const w=im.width*ratio,h=im.height*ratio;ctx.save();ctx.fillStyle="#ffffff";ctx.shadowColor="#00000022";ctx.shadowBlur=12;ctx.fillRect(x,y,300,190);ctx.restore();ctx.drawImage(im,x+(300-w)/2,y+(190-h)/2,w,h);ctx.fillStyle="#263653";ctx.font="23px Georgia";ctx.fillText(wishPictures[chosen[i]][1],x+150,y+225,300);drawn++;}
ctx.fillStyle="#263653";ctx.font="27px Georgia";wrapText(ctx,state.wishText,600,1210,1000,38,5);ctx.font="24px Georgia";ctx.fillText("Мой путь начинается с маленького шага",600,1450);
try{state.boardDataUrl=canvas.toDataURL("image/png");box.innerHTML=`<div class="boardPreview"><h3>Твоя карта желаний готова</h3><img src="${state.boardDataUrl}" alt="Готовая карта желаний"><a href="${state.boardDataUrl}" download="karta-zhelaniy.png">Сохранить карту на устройство</a><p class="small">Если ссылка не скачивает файл на iPhone: нажми и удерживай изображение карты, затем выбери «Сохранить в Фото» или «Сохранить в Файлы».</p></div>`;box.scrollIntoView({behavior:"smooth",block:"start"});}catch(e){box.innerHTML='<p class="small">Не удалось подготовить изображение в этом браузере. Попробуй выбрать меньше картинок.</p>';}}
function saveWishBoard(){getBoardValues();completeChapter(3,chapter5);}
function chapter5(){state.page="4";show(`
${hero("Дорога возможностей","ГЛАВА ПЯТАЯ","chapter5_road.png")}
<div class="story"><p>За дворцом начинается дорога. Она уходит вдаль, а вдоль неё загораются маленькие фонари. На каждом — словно невидимая надпись: «интерес», «выбор», «попробовать», «начать».</p><p>Хранительница идёт рядом и говорит: «Желание становится ближе, когда у него появляется первый шаг. Не нужно заранее знать весь путь. Достаточно выбрать направление и заметить то, что уже сейчас тебе по силам».</p></div>

  function chapter6(){state.page="5";show(`

<div class="story"><p>Когда письмо растворяется в золотистом свете, ты замечаешь рядом маленькую шкатулку. Внутри — несколько закрытых образов. Хранительница шепчет: «Выбери один. Не пытайся угадать значение — просто доверься тому, к чему потянется рука. Иногда образ помогает увидеть то, о чём мы ещё не успели подумать».</p></div>

${btn("Выбрать МАК-карту","macChoice()")}`);}
function macChoice(){state.page="5";show(`
